name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Saisir exactement : DEPLOY ALPHA 0.13.0 - Security & Reliability"
        required: true
        type: string
      backend_migrations_ready:
        description: "Migrations 01-05 appliquees et verifiees"
        required: true
        type: boolean
      edge_functions_ready:
        description: "Huit Edge Functions deployees et verifiees"
        required: true
        type: boolean
      backend_smoke_tests_passed:
        description: "Smoke tests backend et Edge valides"
        required: true
        type: boolean
      production_release_approved:
        description: "Mise en production explicitement approuvee"
        required: true
        type: boolean
      exposed_credentials_rotated:
        description: "Tous les credentials exposes ou privilegies inventories ont ete rotates"
        required: true
        type: boolean
      git_history_scan_reviewed:
        description: "Scan complet des refs et objets Git revu sans secret actif non rotate"
        required: true
        type: boolean

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate manual production readiness
        env:
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
          BACKEND_MIGRATIONS_READY: ${{ inputs.backend_migrations_ready }}
          EDGE_FUNCTIONS_READY: ${{ inputs.edge_functions_ready }}
          BACKEND_SMOKE_TESTS_PASSED: ${{ inputs.backend_smoke_tests_passed }}
          PRODUCTION_RELEASE_APPROVED: ${{ inputs.production_release_approved }}
          EXPOSED_CREDENTIALS_ROTATED: ${{ inputs.exposed_credentials_rotated }}
          GIT_HISTORY_SCAN_REVIEWED: ${{ inputs.git_history_scan_reviewed }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Deployment refused: dispatch must target main."
            exit 1
          fi
          if [ "$RELEASE_CONFIRMATION" != "DEPLOY ALPHA 0.13.0 - Security & Reliability" ]; then
            echo "Deployment refused: release confirmation is invalid."
            exit 1
          fi
          for attestation in \
            "$BACKEND_MIGRATIONS_READY" \
            "$EDGE_FUNCTIONS_READY" \
            "$BACKEND_SMOKE_TESTS_PASSED" \
            "$PRODUCTION_RELEASE_APPROVED" \
            "$EXPOSED_CREDENTIALS_ROTATED" \
            "$GIT_HISTORY_SCAN_REVIEWED"
          do
            if [ "$attestation" != "true" ]; then
              echo "Deployment refused: every readiness attestation is required."
              exit 1
            fi
          done
          echo "Manual production readiness accepted."

  postgresql-17:
    needs: readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Run the isolated PostgreSQL 17 release gate
        run: npm run test:database
        env:
          MPP_ALLOW_EPHEMERAL_DATABASE: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: postgres
          PGSSLMODE: disable

  build:
    needs: readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Setup pinned Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.8.1
      - name: Check Edge Functions with Deno
        run: |
          deno fmt --check supabase/functions
          deno lint supabase/functions
          deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - name: Install Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Run the complete release gate and build the Pages allowlist
        run: npm run ci:pages
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the allowlisted artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site-dist
          name: github-pages

  deploy:
    needs: [readiness, build, postgresql-17]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
